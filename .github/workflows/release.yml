# Windows installer build + release for Drawing Analyzer.
#
# What it does:
#   * push a tag  vX.Y.Z  -> the `build` job builds the installer + latest.json,
#                            then the tag-only `publish` job attaches both to a
#                            GitHub Release. The installed app's updater fetches
#                            releases/latest/download/latest.json to discover it.
#   * pull_request / workflow_dispatch (packaging-related changes) -> the `build`
#                            job builds + self-checks + compiles the installer
#                            WITHOUT publishing, and uploads the artifacts, so the
#                            whole Windows packaging pipeline is validated (and the
#                            installer is downloadable) before any release.
#
# Cutting a release (see docs/RELEASE_WINDOWS.md for the full runbook):
#   1. Bump the version in pyproject.toml AND src/drawing_analyzer/__init__.py
#      (tests/test_release_metadata.py keeps them in lockstep).
#   2. Commit, then:  git tag v1.2.3 && git push origin v1.2.3
#   3. This workflow builds and publishes the release automatically. A tag with
#      an `rcN` suffix is published as a GitHub *pre-release*, so it never
#      becomes `releases/latest` and is not auto-offered to stable installs.
#
# Security posture (mirrors .github/workflows/ci.yml §9.8):
#   * The `build` job executes repo-controlled code (PyInstaller runs the spec
#     and imports the package), so it is READ-ONLY: `contents: read`, and the
#     checkout does not persist the git credential. A PR build therefore never
#     holds a write-capable token.
#   * Only the `publish` job has `contents: write`, it is gated to tag refs, and
#     it runs NO repo code — it just downloads the built artifact and calls `gh`.
#   * `publish` also needs the tag-gated `gates` and `gates-windows` jobs
#     (P9 item 42), so a release cannot be published from a commit whose full
#     automated gate set — Linux and Windows suites, import isolation, secret
#     scan, browser exploit suite, wheel build, static analysis, license and CVE
#     audits — has not passed on that exact commit. They run here rather than
#     being inherited from ci.yml: ci.yml triggers on `v*` tags too, but a
#     separate workflow run is not a dependency of this one.
#   * Third-party actions are pinned to immutable commit SHAs (the trailing
#     comment is the human-readable version).
#
# NOTE TO MAINTAINER: the action SHAs below were pinned from their release tags
# but could not be re-verified against the GitHub API from the build sandbox.
# Confirm them (or let Dependabot manage them) before relying on this workflow —
# a stale/incorrect SHA fails loudly at that step, it is never a silent gap.
name: Release (Windows installer)

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/release.yml"
      - "src/drawing_analyzer/core/updates.py"
      - "pyproject.toml"
  workflow_dispatch:

# Least privilege by default; the tag-gated publish job elevates to write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    # Read-only: this job runs PR-controlled code (PyInstaller executes the spec
    # and imports the package). No write token is ever exposed to it.
    permissions:
      contents: read
    env:
      # The known-good Inno Setup floor: the oldest compiler this installer
      # script is accepted against, and the version installed if the runner
      # image ever stops shipping one. One number, one place.
      INNO_SETUP_MIN: "6.2.2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Don't leave a push-capable credential in .git/config for later steps.
          persist-credentials: false

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $v = $ref -replace "^refs/tags/v", ""
          } else {
            $v = python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version: $v"

      - name: Guard - tag matches both version literals
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        # Checks the tag against BOTH pyproject.toml AND
        # src/drawing_analyzer/__init__.py (the version the frozen app reports
        # to the updater). A half-bumped tag would otherwise ship an installer
        # stuck in a perpetual "update available" loop.
        run: python packaging/windows/check_release_version.py --tag "${{ github.ref_name }}"

      - name: Install app (gui extras) + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Constrained by requirements-release.lock (P9 item 41). ci.yml already
          # builds the wheel and runs the clean-install smoke under this lock; the
          # installer that actually ships was the one build that ignored it, so the
          # shipped binary could bundle dependency versions no gate had ever seen —
          # while docs/RELEASE_ACCEPTANCE_TEMPLATE.md carried a "Dependency lock
          # used" checkbox saying otherwise. The lock is the point of the file.
          pip install -c requirements-release.lock -e ".[gui]"
          pip install "pyinstaller==6.11.1"

      - name: Build one-folder app (PyInstaller)
        shell: pwsh
        run: pyinstaller packaging/windows/drawing-analyzer.spec --noconfirm --clean

      - name: Smoke - frozen exe self-check
        shell: pwsh
        run: |
          $env:DRAWING_ANALYZER_SELFCHECK_OUT = "$PWD\selfcheck.txt"
          $p = Start-Process -FilePath "dist\DrawingAnalyzer\DrawingAnalyzer.exe" `
                 -ArgumentList "--selfcheck" -Wait -PassThru
          if (Test-Path selfcheck.txt) { Get-Content selfcheck.txt }
          if ($p.ExitCode -ne 0) {
            Write-Error "Frozen exe self-check failed (exit $($p.ExitCode)) - a hidden import is likely missing from the spec."
            exit 1
          }

      - name: Resolve Inno Setup compiler
        id: iscc
        shell: pwsh
        # P9 item 41, corrected after measurement. The goal is the one tool in
        # this pipeline whose output IS the shipped artifact, and which had no
        # version recorded anywhere. A pinned `choco install` looked like the
        # answer and is not: the windows-latest image already ships Inno Setup
        # (6.7.1 as of 2026-09), so pinning an older version asks Chocolatey to
        # downgrade and it refuses outright — "A newer version of InnoSetup
        # (v6.7.1) is already installed", 0/1 packages, job failed.
        #
        # Using the compiler the image already provides is also the stronger
        # supply-chain posture, not a concession: a build that downloads no
        # compiler cannot be served a bad package at all, so there is no feed,
        # no download and no checksum to trust. What remains is to (a) refuse a
        # compiler older than the known-good floor and (b) RECORD the exact
        # version that built the artifact, which is what was actually missing.
        # The pinned `choco install` survives only as the fallback for an image
        # that stops shipping one, where there is no preinstalled version to
        # conflict with; `--require-checksums` refuses a package whose checksum
        # the feed does not publish.
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Host "Inno Setup 6 is not on this image; installing the pinned fallback."
            choco install innosetup --version=$env:INNO_SETUP_MIN --no-progress --require-checksums -y
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Error "Inno Setup 6 compiler not found at $iscc"
            exit 1
          }
          $info = (Get-Item -LiteralPath $iscc).VersionInfo
          $raw = $info.ProductVersion
          if (-not $raw) { $raw = $info.FileVersion }
          $parsed = [regex]::Match([string]$raw, '\d+(\.\d+){1,3}')
          if (-not $parsed.Success) {
            Write-Error "could not read a version number from '$raw'"
            exit 1
          }
          $found = [version]$parsed.Value
          $floor = [version]$env:INNO_SETUP_MIN
          Write-Host "Inno Setup compiler: $iscc"
          Write-Host "Inno Setup version : $found  (known-good floor $floor)"
          "Installer compiled by Inno Setup $found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($found -lt $floor) {
            Write-Error "Inno Setup $found is older than the known-good floor $floor"
            exit 1
          }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile installer (Inno Setup ${{ steps.iscc.outputs.version }})
        shell: pwsh
        # The compiler path comes from the resolve step above — one definition,
        # so the two cannot drift — and travels through the environment rather
        # than being interpolated into the command line.
        env:
          ISCC: ${{ steps.iscc.outputs.path }}
        run: |
          & "$env:ISCC" /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\windows\installer.iss

      - name: Generate update manifest (latest.json)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/DrawingAnalyzerSetup.exe"
          python packaging/windows/make_manifest.py `
            --version $v `
            --installer dist/installer/DrawingAnalyzerSetup.exe `
            --url $url `
            --out dist/installer/latest.json `
            --notes "Drawing Analyzer v$v. See the release notes for details." `
            --published-at (Get-Date -Format "yyyy-MM-dd")
          Get-Content dist/installer/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: windows-installer
          path: |
            dist/installer/DrawingAnalyzerSetup.exe
            dist/installer/latest.json
          if-no-files-found: error

  gates:
    # The release gates, on the tagged commit itself (P9 item 42). ci.yml is
    # required in branch protection, but branch protection does not apply to a
    # tag push, and a tag can name any commit — so before this, `publish` needed
    # only that the installer *compiled*. A tag pointing at a commit with a
    # failing suite published an installer built from it.
    #
    # Every release-critical check runs INSIDE the needs chain (Codex review).
    # ci.yml also triggers on `v*` tags, but starting a second workflow for the
    # same tag does not make it a dependency of this one: `publish` would happily
    # create the release while those jobs were still running, or after one had
    # failed. So this job runs the full `run_acceptance.py` — no `--fast` — with
    # Playwright and Chromium installed so the browser exploit suite genuinely
    # executes rather than skipping itself, plus the three §19.8 audits the
    # acceptance script does not own (static analysis, licenses, CVEs).
    name: Release gates (full automated suite)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install (engine + dev + browser test + build tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browsertest]"
          pip install "build==1.4.0"
      - name: Install Chromium (so the browser gate cannot skip itself)
        run: python -m playwright install --with-deps chromium
      - name: Phase 27 release gates (all of them)
        run: python scripts/run_acceptance.py
      - name: Static analysis (correctness classes only — no style churn)
        run: |
          pip install "ruff==0.14.5"
          ruff check --select E9,F63,F7,F82 src tests scripts
      - name: Dependency license / AGPL-notice audit
        run: |
          pip install -c requirements-release.lock ".[dev]"
          python scripts/check_licenses.py
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install "pip-audit==2.9.0"
          pip-audit --skip-editable

  gates-windows:
    # The Windows leg of the hermetic suite, in the needs chain for the same
    # reason. It is not redundant with `gates`: this app ships as a Windows
    # desktop binary and a good deal of its behaviour is Windows-only — path
    # length and case handling, the `\\?\` long-path form, `os.utime` support,
    # Credential Manager key storage. A release must not publish past a red
    # Windows suite.
    name: Release gates (hermetic suite, windows)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Install (engine + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: PyMuPDF import isolation (I-5)
        run: python -m pytest -q -m "not network" tests/test_import_isolation.py
      - name: Hermetic test suite
        run: python -m pytest -q -m "not network"

  publish:
    name: Publish GitHub Release
    needs: [build, gates, gates-windows]
    # Tag refs only. This job runs NO repo-controlled code — it downloads the
    # already-built artifact and calls `gh` — so holding a write token here does
    # not expose the repo to PR-supplied build steps.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release / upload assets
      actions: read      # download-artifact reads the run's artifact
    steps:
      - name: Download built installer
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: windows-installer
          path: artifact

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes=$'Windows installer for Drawing Analyzer '"$tag"$'.\n\n'
          notes+=$'Download **DrawingAnalyzerSetup.exe** below and run it. '
          notes+=$'The app is not code-signed, so Windows SmartScreen may warn on '
          notes+=$'first run - choose **More info** then **Run anyway**.\n\n'
          notes+=$'Existing installs will offer this update automatically.'

          # A release-candidate tag (vX.Y.ZrcN) is published as a pre-release so
          # GitHub never marks it "latest" — the updater reads
          # releases/latest/download/latest.json, so stable installs are not
          # auto-offered an RC.
          flags=(--verify-tag --title "Drawing Analyzer ${tag}" --notes "${notes}")
          if [[ "${version}" == *rc* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          assets=(artifact/DrawingAnalyzerSetup.exe artifact/latest.json)
          if ! gh release create "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}"; then
            # Release already exists (e.g. a re-run) - replace the assets.
            gh release upload "${tag}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          fi
